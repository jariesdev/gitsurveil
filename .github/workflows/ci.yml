name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on all three platforms deliberately. The Windows named-pipe transport
  # in socket.rs and daemon.rs has never been executed on Windows — this is the
  # first thing that compiles and exercises it.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The Tauri crate needs a frontend bundle to exist before it will build,
      # even for `cargo test`, because generate_context! embeds it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The app crate's build script embeds the daemon as a sidecar resource and
      # fails without it (binaries/ is gitignored). Stage it for the host triple
      # so `cargo test`/`cargo build --workspace` can compile the app.
      - name: Stage the daemon sidecar
        shell: bash
        run: ./scripts/bundle-daemon.sh

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  # Enforced by CLAUDE.md: every public item is documented and cargo doc is
  # warning-free. Linux only — the lint is platform-independent.
  docs:
    name: Docs warning-free
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libglib2.0-dev libgtk-3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Same sidecar requirement as the rust job: `cargo doc --workspace` builds
      # the app crate, which embeds the daemon and fails without it staged.
      - name: Stage the daemon sidecar
        shell: bash
        run: ./scripts/bundle-daemon.sh
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Test
        run: pnpm test

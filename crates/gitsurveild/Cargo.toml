[package]
name = "gitsurveild"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gitsurveild"
path = "src/main.rs"

[dependencies]
gitsurveil-proto = { path = "../gitsurveil-proto" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.1.6"
octocrab = "0.54.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
toml = "1.1.4"
directories = "6.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
notify-rust = "4.18.0"
# `https` is not a default feature in git2 0.21 — without it libgit2 has no TLS
# backend and HTTPS clones fail with "there is no TLS stream available".
# `vendored-openssl` builds OpenSSL from source, so the daemon needs no system
# OpenSSL headers on any target and cross-compiles cleanly (the release matrix
# cross-builds the daemon for x86_64-apple-darwin from an arm64 runner, where a
# system openssl-sys sysroot isn't available).
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }
